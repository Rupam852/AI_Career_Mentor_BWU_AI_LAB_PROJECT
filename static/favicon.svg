<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Outer Glow Filter -->
  <defs>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="brainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>

  <!-- Stylized AI Brain / Neurology Icon Structure (Transparent Background) -->
  <g filter="url(#cyanGlow)" stroke="url(#brainGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Center Neural Spine -->
    <line x1="32" y1="12" x2="32" y2="52" />
    
    <!-- Left Hemisphere Lobes -->
    <path d="M 32 14 C 24 10 16 16 16 23 C 10 24 10 32 15 35 C 10 39 12 47 18 48 C 24 49 28 45 32 50" />
    <path d="M 32 24 C 23 23 20 29 25 33 C 20 37 24 43 32 40" />

    <!-- Right Hemisphere Lobes (Mirrored) -->
    <path d="M 32 14 C 40 10 48 16 48 23 C 54 24 54 32 49 35 C 54 39 52 47 46 48 C 40 49 36 45 32 50" />
    <path d="M 32 24 C 41 23 44 29 39 33 C 44 37 40 43 32 40" />
  </g>
</svg>
